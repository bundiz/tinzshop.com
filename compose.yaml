# Local development database only. Trust auth is acceptable because the port is
# bound to loopback; no password exists anywhere in this repository.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tinzshop
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tinzshop-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  tinzshop-pgdata:
